name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff-report.txt

      - name: mypy
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          mypy src 2>&1 | tee mypy-report.txt

      - name: pytest with coverage
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest \
            --cov=marketops \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 \
            2>&1 | tee test-report.txt

      - name: Installed wheel smoke test
        id: wheel
        continue-on-error: true
        run: |
          set -euo pipefail
          wheel_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          {
            python -m pip wheel . --no-deps --wheel-dir "${wheel_dir}"
            python -m pip uninstall -y marketops-id
            wheel_path="$(find "${wheel_dir}" -maxdepth 1 -name '*.whl' -print -quit)"
            test -n "${wheel_path}"
            python -m pip install --no-deps "${wheel_path}"
            cd "${smoke_dir}"
            export MARKETOPS_DB_PATH="${smoke_dir}/marketops.db"
            export MARKETOPS_ARTIFACT_DIR="${smoke_dir}/artifacts"
            marketops doctor
            marketops run --mode fixture --dry-notify
            test -s "${smoke_dir}/artifacts/latest.json"
            test -s "${smoke_dir}/artifacts/latest.html"
          } 2>&1 | tee wheel-smoke-report.txt

      - name: Write CI summary
        if: always()
        env:
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          MYPY_RESULT: ${{ steps.mypy.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
          WHEEL_RESULT: ${{ steps.wheel.outcome }}
        run: |
          {
            echo "## MarketOps ID quality gates"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Ruff | ${RUFF_RESULT} |"
            echo "| mypy | ${MYPY_RESULT} |"
            echo "| pytest + coverage >=80% | ${PYTEST_RESULT} |"
            echo "| installed wheel smoke | ${WHEEL_RESULT} |"
            echo
            echo "Coverage details are attached to this workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ruff-report.txt
            mypy-report.txt
            test-report.txt
            wheel-smoke-report.txt
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce quality gates
        if: always()
        env:
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          MYPY_RESULT: ${{ steps.mypy.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
          WHEEL_RESULT: ${{ steps.wheel.outcome }}
        run: |
          if [[ "${RUFF_RESULT}" != "success" || \
                "${MYPY_RESULT}" != "success" || \
                "${PYTEST_RESULT}" != "success" || \
                "${WHEEL_RESULT}" != "success" ]]; then
            echo "One or more required quality gates failed."
            exit 1
          fi
