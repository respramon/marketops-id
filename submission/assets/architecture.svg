<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MarketOps ID unattended research triage architecture</title>
  <desc id="desc">GitHub Actions schedule invokes Sectors API discovery and selective enrichment, then normalization, correlation, scoring, stateful deduplication, research queue, notification, artifacts, and dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0a5"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#65758d"/>
    </marker>
    <style>
      .label { font: 600 17px Arial, sans-serif; fill: #e6eaf2; }
      .detail { font: 400 13px Arial, sans-serif; fill: #9aa5b8; }
      .eyebrow { font: 700 13px Arial, sans-serif; fill: #35d0a5; letter-spacing: 2px; }
      .node { fill: #121926; stroke: #26344a; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .node-accent { fill: #11211f; stroke: #35d0a5; stroke-width: 1.8; rx: 14; filter: url(#shadow); }
      .node-warn { fill: #261d12; stroke: #f5a623; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .edge { fill: none; stroke: #65758d; stroke-width: 2; marker-end: url(#arrow); }
      .edge-accent { fill: none; stroke: #35d0a5; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="54" y="42" width="1492" height="816" rx="22" fill="none" stroke="#26344a"/>
  <text x="94" y="104" class="eyebrow">MARKETOPS ID / TRACK 2 AUTOMATION</text>
  <text x="94" y="149" style="font:700 38px Arial,sans-serif;fill:#e6eaf2">Autonomous IDX Research Triage</text>
  <text x="94" y="180" class="detail">Configured weekday schedule at 07:17 WIB. Research triage only - no investment recommendation or trade execution.</text>

  <rect class="node-accent" x="102" y="258" width="232" height="112"/>
  <text class="label" x="128" y="302">GitHub Actions</text>
  <text class="detail" x="128" y="329">schedule + workflow dispatch</text>
  <text class="detail" x="128" y="351">07:17 WIB weekdays</text>

  <rect class="node-accent" x="442" y="258" width="270" height="112"/>
  <text class="label" x="468" y="302">Sectors API v2</text>
  <text class="detail" x="468" y="329">filings / suspensions / movers</text>
  <text class="detail" x="468" y="351">news / flow / corp actions</text>

  <rect class="node" x="820" y="234" width="250" height="70"/>
  <text class="label" x="846" y="275">Normalize events</text>
  <text class="detail" x="846" y="294">canonical IDX ticker + WIB</text>
  <rect class="node" x="820" y="338" width="250" height="70"/>
  <text class="label" x="846" y="379">Select candidates</text>
  <text class="detail" x="846" y="398">broad discovery, selective cost</text>
  <rect class="node" x="820" y="442" width="250" height="70"/>
  <text class="label" x="846" y="483">Correlate + score</text>
  <text class="detail" x="846" y="502">explainable P1 / P2 / P3</text>

  <rect class="node-warn" x="1178" y="258" width="282" height="112"/>
  <text class="label" x="1204" y="302">SQLite state</text>
  <text class="detail" x="1204" y="329">atomic event claims + alerts</text>
  <text class="detail" x="1204" y="351">dedup + audit + run history</text>

  <rect class="node-accent" x="1178" y="478" width="282" height="112"/>
  <text class="label" x="1204" y="522">Research queue</text>
  <text class="detail" x="1204" y="549">evidence-linked analyst cards</text>
  <text class="detail" x="1204" y="571">only undelivered evidence notifies</text>

  <rect class="node" x="788" y="676" width="240" height="104"/>
  <text class="label" x="814" y="720">Run artifacts</text>
  <text class="detail" x="814" y="747">HTML / JSON / logs</text>
  <text class="detail" x="814" y="769">GitHub artifact upload</text>

  <rect class="node" x="1138" y="676" width="322" height="104"/>
  <text class="label" x="1164" y="720">Delivery + dashboard</text>
  <text class="detail" x="1164" y="747">Discord or generic webhook</text>
  <text class="detail" x="1164" y="769">read-only FastAPI evidence view</text>

  <path class="edge-accent" d="M334 314 H442"/>
  <path class="edge-accent" d="M712 314 H770 Q790 314 790 269 H820"/>
  <path class="edge" d="M945 304 V338"/>
  <path class="edge" d="M945 408 V442"/>
  <path class="edge" d="M1070 477 H1124 Q1148 477 1148 350 H1178"/>
  <path class="edge-accent" d="M1070 477 H1178"/>
  <path class="edge" d="M1319 370 V478"/>
  <path class="edge" d="M1238 590 V624 Q1238 650 1299 650 V676"/>
  <path class="edge" d="M1178 534 H1108 Q1088 534 1088 620 Q1088 650 908 650 V676"/>
  <path class="edge" d="M1319 590 V650"/>

  <rect x="102" y="526" width="554" height="182" rx="14" fill="#0e1420" stroke="#26344a"/>
  <text x="132" y="566" class="eyebrow">GUARDRAILS</text>
  <text x="132" y="604" class="label">Discover broadly. Enrich selectively.</text>
  <text x="132" y="632" class="detail">Hard pre-request credit budget / retries / partial-failure disclosure</text>
  <text x="132" y="658" class="detail">No BUY/SELL output. No brokerage integration. No automated trade.</text>
  <text x="132" y="684" class="detail">Fixture replay is clearly labelled and never represented as live data.</text>
  <rect x="102" y="756" width="554" height="3" rx="2" fill="url(#accent)"/>
</svg>
