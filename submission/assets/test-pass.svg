<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MarketOps ID local QA result</title>
  <desc id="desc">A locally captured quality-gate summary: Ruff and mypy pass; pytest has 375 passing tests and 95.08 percent coverage. This is not GitHub Actions CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081321"/>
      <stop offset="1" stop-color="#132841"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="78" width="1440" height="744" rx="28" fill="#0c1b2d" stroke="#2b4967" stroke-width="2"/>
  <rect x="120" y="122" width="650" height="38" rx="19" fill="#244f43"/>
  <text x="145" y="148" fill="#9ee8c1" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">LOCAL QA RESULT — NOT GITHUB ACTIONS CI</text>
  <text x="120" y="225" fill="#f4f8fb" font-family="Arial, sans-serif" font-size="56" font-weight="700">Quality gates passed</text>
  <text x="120" y="270" fill="#9fb2c4" font-family="Arial, sans-serif" font-size="24">MarketOps ID · Windows · Python 3.12.3 · 27 Aug 2026 WIB</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="24">
    <rect x="120" y="330" width="1360" height="84" rx="14" fill="#07111d" stroke="#294761"/>
    <text x="155" y="381" fill="#d0dae4">uv run ruff check .</text>
    <text x="1290" y="381" fill="#92e8b6" font-weight="700">PASS</text>

    <rect x="120" y="434" width="1360" height="84" rx="14" fill="#07111d" stroke="#294761"/>
    <text x="155" y="485" fill="#d0dae4">uv run mypy src</text>
    <text x="1290" y="485" fill="#92e8b6" font-weight="700">PASS</text>

    <rect x="120" y="538" width="1360" height="124" rx="14" fill="#07111d" stroke="#294761"/>
    <text x="155" y="588" fill="#d0dae4">uv run pytest --cov=marketops --cov-report=term-missing</text>
    <text x="155" y="632" fill="#92e8b6" font-weight="700">375 passed · coverage 95.08% · threshold 80%</text>
    <text x="1290" y="632" fill="#92e8b6" font-weight="700">PASS</text>
  </g>

  <line x1="120" x2="1480" y1="710" y2="710" stroke="#294761"/>
  <text x="120" y="760" fill="#c2d0dd" font-family="Arial, sans-serif" font-size="22">One third-party FastAPI/Starlette TestClient deprecation warning was emitted; no test failed.</text>
  <text x="120" y="797" fill="#7f96aa" font-family="Arial, sans-serif" font-size="19">For CI proof, replace this local capture with a real public GitHub Actions result.</text>
</svg>
